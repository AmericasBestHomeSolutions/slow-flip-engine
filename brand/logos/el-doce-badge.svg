<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="El Doce badge: 12 percent">
  <!-- EL DOCE — 12 ticks, 12 months, 12 percent. Proof, not promises. -->
  <circle cx="60" cy="60" r="56" fill="#0a0a0a"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#f5a623" stroke-width="4"/>
  <g fill="#f5a623">
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(0 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(30 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(60 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(90 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(120 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(150 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(180 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(210 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(240 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(270 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(300 60 60)"/>
    <rect x="58.75" y="12" width="2.5" height="8" transform="rotate(330 60 60)"/>
  </g>
  <g fill="#f5a623" transform="translate(33,45)">
    <!-- 1 -->
    <rect x="0" y="0" width="6" height="30"/>
    <!-- 2 (scoreboard segments) -->
    <rect x="12" y="0"    width="16" height="5"/>
    <rect x="23" y="0"    width="5"  height="15"/>
    <rect x="12" y="12.5" width="16" height="5"/>
    <rect x="12" y="15"   width="5"  height="15"/>
    <rect x="12" y="25"   width="16" height="5"/>
    <!-- percent -->
    <circle cx="38" cy="5" r="4.5"/>
    <circle cx="50" cy="25" r="4.5"/>
    <rect x="42.5" y="-2" width="4" height="34" transform="rotate(24 44 15)"/>
  </g>
</svg>
